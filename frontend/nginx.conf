server {
    listen 80;
    root /usr/share/nginx/html;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_read_timeout 600s;
    }

    location /health {
        proxy_pass http://backend:8000;
    }

    # SPA routing — unknown paths fall back to index.html
    location / {
        try_files $uri /index.html;
    }
}
